[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "krypt0n67-blake256"
version = "0.2.0"
description = "Pure-Python BLAKE-256 implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "krypt0n67", email = "krypt0n67@fastmail.com"}]
dependencies = []

[project.scripts]
blake256-py = "blake256:main"

[tool.setuptools]
py-modules = ["blake256"]
